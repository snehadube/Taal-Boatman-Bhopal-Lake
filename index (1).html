<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taal Boatman - Bhopal Lake Game</title>
<style>
  body{margin:0;background:#12263a;color:#f3e9d2;font-family:Georgia,serif;text-align:center}
  h1{margin:10px 0 2px;font-size:26px;letter-spacing:1px}
  canvas{background:#87ceeb;border:4px solid #f3e9d2;border-radius:8px;max-width:96vw;touch-action:none}
  p{margin:6px;font-size:14px}
</style>
</head>
<body>
<h1>Taal Boatman: Bhopal Lake</h1>
<canvas id="c" width="640" height="480"></canvas>
<p>Arrow keys / A-D / mouse / touch to move. P = pause, R = restart.</p>

<script>
// ---------- SETUP ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let state = 'start';            // start | playing | paused | over
let score, lives, combo, level, slowT, spawnT, items, texts, shake, best, tPrev, waveT = 0;
try { best = +localStorage.getItem('taalBest') || 0; } catch (e) { best = 0; }
const boat = { x: W / 2, y: H - 70, w: 96, h: 36, speed: 380 };
const keys = {};
let particles = [], ripples = [], clouds = [], tilt = 0, prevX = 0, banner = 0;
for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 90, s: 0.6 + Math.random() * 0.8 });
function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 60 + Math.random() * 140;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0.6 + Math.random() * 0.4, c: col }); }
  ripples.push({ x, y: boat.y + 22, r: 6, life: 1 });
}

// ---------- SOUND (made with WebAudio, no files needed) ----------
let ac;
function beep(f, d, type = 'sine', vol = 0.15) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

// ---------- GAME STATE ----------
function reset() {
  score = 0; lives = 3; combo = 0; level = 1; slowT = 0; spawnT = 0;
  items = []; texts = []; shake = 0; boat.x = W / 2; particles = []; ripples = []; banner = 0;
}
function startGame() { reset(); state = 'playing'; beep(520, 0.15); }

// ---------- INPUT ----------
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  const k = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if ((k === 'enter' || k === ' ') && (state === 'start' || state === 'over')) startGame();
  if (k === 'p') { if (state === 'playing') state = 'paused'; else if (state === 'paused') state = 'playing'; }
  if (k === 'r' && state !== 'start') startGame();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
function pointerX(clientX) {
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
cv.addEventListener('mousemove', e => { if (state === 'playing') boat.x = pointerX(e.clientX); });
cv.addEventListener('touchmove', e => { if (state === 'playing') boat.x = pointerX(e.touches[0].clientX); }, { passive: true });
cv.addEventListener('click', () => { if (state === 'start' || state === 'over') startGame(); });
cv.addEventListener('touchstart', () => { if (state === 'start' || state === 'over') startGame(); }, { passive: true });

// ---------- SPAWNING ----------
function spawn() {
  const r = Math.random();
  let type = 'lotus';
  if (r > 0.92) type = 'golden';            // special power-up
  else if (r > 0.60) type = Math.random() < 0.5 ? 'bottle' : 'bag';   // hazards
  items.push({ x: 30 + Math.random() * (W - 60), y: -20, type, r: 16, ph: Math.random() * 6 });
}

// ---------- UPDATE ----------
function update(dt) {
  waveT += dt;
  clouds.forEach(c => { c.x += 12 * c.s * dt; if (c.x > W + 70) c.x = -70; });
  particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
  ripples.forEach(r => { r.r += 60 * dt; r.life -= dt; });
  ripples = ripples.filter(r => r.life > 0);
  if (state !== 'playing') return;
  if (Math.random() < dt * 2) ripples.push({ x: boat.x + (Math.random() - 0.5) * 60, y: boat.y + 22, r: 5, life: 1 });

  // player movement
  if (keys['arrowleft'] || keys['a']) boat.x -= boat.speed * dt;
  if (keys['arrowright'] || keys['d']) boat.x += boat.speed * dt;
  boat.x = Math.max(boat.w / 2, Math.min(W - boat.w / 2, boat.x));
  const vx = (boat.x - prevX) / Math.max(dt, 0.001); prevX = boat.x;       // boat tilts as it moves
  tilt += (Math.max(-0.3, Math.min(0.3, vx / boat.speed * 0.25)) - tilt) * Math.min(1, dt * 10);
  if (banner > 0) banner -= dt;

  // difficulty: every 100 points = new level = faster + more spawns
  const nl = 1 + Math.floor(score / 100);
  if (nl > level) { banner = 1.5; beep(760, 0.25, 'square', 0.1); }
  level = nl;
  const slow = slowT > 0 ? 0.45 : 1;
  const fall = (110 + level * 28) * slow;
  const gap = Math.max(0.3, 0.95 - level * 0.07);
  if (slowT > 0) slowT -= dt;
  if (shake > 0) shake -= dt;

  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = gap; }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += fall * dt;
    it.x += Math.sin(waveT * 2 + it.ph) * 25 * dt;      // gentle sway

    // COLLISION: box-vs-box (AABB) between boat and item
    const hit = it.x + it.r > boat.x - boat.w / 2 && it.x - it.r < boat.x + boat.w / 2 &&
                it.y + it.r > boat.y - boat.h / 2 && it.y - it.r < boat.y + boat.h / 2;
    if (hit) {
      collect(it);
      items.splice(i, 1);
    } else if (it.y > H + 30) {
      if (it.type === 'lotus') combo = 0;               // missed a lotus
      items.splice(i, 1);
    }
  }
  texts.forEach(t => { t.y -= 40 * dt; t.life -= dt; });
  texts = texts.filter(t => t.life > 0);
}

function collect(it) {
  if (it.type === 'lotus' || it.type === 'golden') {
    combo++;
    const mult = Math.min(5, 1 + Math.floor(combo / 3));   // custom scoring: combo multiplier
    const pts = (it.type === 'golden' ? 30 : 10) * mult;
    score += pts;
    texts.push({ x: it.x, y: it.y, s: '+' + pts + (mult > 1 ? ' x' + mult : ''), life: 0.8, c: '#fff' });
    burst(it.x, it.y, it.type === 'golden' ? '#ffd23f' : '#ff8fb8', it.type === 'golden' ? 24 : 12);
    if (it.type === 'golden') { slowT = 5; beep(880, 0.3, 'triangle'); }   // power-up: slow time
    else beep(660 + combo * 20, 0.1);
  } else {
    lives--; combo = 0; shake = 0.3; burst(it.x, it.y, '#9be7ff', 18);
    score = Math.max(0, score - 10);
    texts.push({ x: it.x, y: it.y, s: '-10', life: 0.8, c: '#ff6b6b' });
    beep(140, 0.35, 'sawtooth', 0.2);
    if (lives <= 0) {
      state = 'over';
      if (score > best) { best = score; try { localStorage.setItem('taalBest', best); } catch (e) {} }
    }
  }
}

// ---------- DRAWING ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (slowT > 0) { g.addColorStop(0, '#ffd27a'); g.addColorStop(0.45, '#ffeab8'); }
  else { g.addColorStop(0, '#f6a56b'); g.addColorStop(0.45, '#ffd9a0'); }
  g.addColorStop(0.45, '#2f7f9f'); g.addColorStop(1, '#0f3d57');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sun
  ctx.fillStyle = 'rgba(255,243,196,' + (0.25 + 0.1 * Math.sin(waveT * 2)) + ')';
  ctx.beginPath(); ctx.arc(500, 110, 62, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(500, 110, 42, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  clouds.forEach(c => { [[0, 0, 22], [20, 4, 17], [-20, 6, 15]].forEach(([dx, dy, r]) => {
    ctx.beginPath(); ctx.arc(c.x + dx * c.s, c.y + dy * c.s, r * c.s, 0, 7); ctx.fill(); }); });
  // far hills + Taj-ul-Masajid style domes on the shore
  ctx.fillStyle = '#7a4b5c';
  ctx.beginPath(); ctx.moveTo(0, 216); ctx.quadraticCurveTo(160, 150, 320, 216); ctx.quadraticCurveTo(480, 160, 640, 216); ctx.fill();
  ctx.fillStyle = '#4a2c3d';
  [[110, 40], [150, 28], [190, 40]].forEach(([x, r]) => {
    ctx.beginPath(); ctx.arc(x, 216, r, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - 2, 216 - r - 18, 4, 18);
  });
  ctx.fillRect(80, 200, 140, 16);
  // moving waves
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
  for (let row = 0; row < 8; row++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 10) {
      const y = 235 + Math.pow(row, 1.4) * 14 + Math.sin(x / (40 + row * 4) + waveT * 2 + row) * (2 + row * 0.7);
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
}
function drawLotus(x, y, gold) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = gold ? '#ffd23f' : '#ff8fb8';
  for (let a = 0; a < 6; a++) {
    ctx.rotate(Math.PI / 3);
    ctx.beginPath(); ctx.ellipse(0, -10, 6, 12, 0, 0, 7); ctx.fill();
  }
  ctx.fillStyle = gold ? '#fff6c2' : '#ffe14d';
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
  if (gold) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 20, 0, 7); ctx.stroke(); }
  ctx.restore();
}
function drawBottle(x, y) {
  ctx.fillStyle = 'rgba(190,230,255,0.9)'; ctx.fillRect(x - 7, y - 4, 14, 22);
  ctx.fillRect(x - 3, y - 14, 6, 10);
  ctx.fillStyle = '#e53935'; ctx.fillRect(x - 4, y - 17, 8, 4);
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.strokeRect(x - 7, y - 4, 14, 22);
}
function drawBag(x, y) {
  ctx.fillStyle = '#f2f2f2'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x - 12, y - 10); ctx.lineTo(x + 12, y - 10);
  ctx.lineTo(x + 16, y + 14); ctx.lineTo(x - 16, y + 14); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(x - 6, y - 12, 5, Math.PI, 0); ctx.arc(x + 6, y - 12, 5, Math.PI, 0); ctx.stroke();
}
function drawBoat() {
  const bob = Math.sin(waveT * 4) * 2;
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(boat.x, boat.y + 26, 52, 8, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(boat.x, boat.y + bob); ctx.rotate(tilt);
  // hull
  ctx.fillStyle = '#8b4513';
  ctx.beginPath(); ctx.moveTo(-48, -10); ctx.lineTo(48, -10); ctx.lineTo(34, 18); ctx.lineTo(-34, 18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d9822b'; ctx.fillRect(-44, -10, 88, 5);
  // boatman
  ctx.fillStyle = '#2b2b6b'; ctx.fillRect(-6, -34, 12, 24);
  ctx.fillStyle = '#e0a070'; ctx.beginPath(); ctx.arc(0, -40, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-9, -49, 18, 6);   // safa / turban
  // oar
  ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(8, -22); ctx.lineTo(40, 22 + Math.sin(waveT * 4) * 3); ctx.stroke();
  ctx.restore();
}
function drawHUD() {
  ctx.fillStyle = 'rgba(10,25,40,0.65)'; ctx.fillRect(0, 0, W, 38);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Georgia'; ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 12, 25);
  ctx.fillText('Level: ' + level, 150, 25);
  ctx.fillText('Best: ' + best, 260, 25);
  ctx.fillStyle = '#ff8fb8'; ctx.fillText('Combo: ' + combo, 360, 25);
  ctx.fillStyle = '#ff5c5c'; ctx.textAlign = 'right';
  ctx.fillText('♥'.repeat(Math.max(lives, 0)), W - 12, 26);
  if (banner > 0) {
    ctx.save(); ctx.globalAlpha = Math.min(1, banner); ctx.textAlign = 'center';
    ctx.font = 'bold ' + (40 + (1.5 - banner) * 20) + 'px Georgia'; ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 4; ctx.strokeText('LEVEL ' + level, W / 2, 200); ctx.fillText('LEVEL ' + level, W / 2, 200);
    ctx.restore();
  }
  if (slowT > 0) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd23f';
    ctx.fillText('Golden Lotus: time slowed ' + slowT.toFixed(1) + 's', W / 2, 62);
  }
}
function overlay(title, lines) {
  ctx.fillStyle = 'rgba(8,20,35,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffd9a0'; ctx.font = 'bold 40px Georgia';
  ctx.fillText(title, W / 2, 120);
  ctx.fillStyle = '#fff'; ctx.font = '17px Georgia';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 170 + i * 28));
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
  drawBackground();
  ripples.forEach(r => { ctx.strokeStyle = 'rgba(255,255,255,' + (r.life * 0.5) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r * 1.6, r.r * 0.5, 0, 0, 7); ctx.stroke(); });
  items.forEach(it => {                       // pseudo-3D: items grow bigger as they come closer
    const sc = 0.55 + 0.7 * Math.max(0, it.y) / H;
    ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.ellipse(it.x + 8, it.y + 18 * sc, 14 * sc, 5 * sc, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(it.x, it.y); ctx.scale(sc, sc);
    if (it.type === 'lotus' || it.type === 'golden') { ctx.rotate(waveT * 1.5 + it.ph); drawLotus(0, 0, it.type === 'golden'); }
    else { ctx.rotate(Math.sin(waveT * 3 + it.ph) * 0.4); it.type === 'bottle' ? drawBottle(0, 0) : drawBag(0, 0); }
    ctx.restore();
  });
  drawBoat();
  particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1;
  texts.forEach(t => { ctx.fillStyle = t.c; ctx.font = 'bold 18px Georgia'; ctx.textAlign = 'center'; ctx.fillText(t.s, t.x, t.y); });
  ctx.restore();
  if (state !== 'start') drawHUD();
  if (state === 'start') overlay('Taal Boatman', [
    'Bhopal ki Badi Jheel ko saaf rakho!',
    'Pink lotus pakdo: +10   |   Golden lotus: +30 aur time slow',
    'Bottle aur plastic bag se bacho: -1 life, -10 score',
    'Lagatar 3 lotus = combo multiplier (max x5)',
    'Har 100 points par level badhta hai (speed + zyada kachra)',
    'Best: ' + best, 'Enter / Click dabao start karne ke liye']);
  if (state === 'paused') overlay('Paused', ['P dabao dobara chalu karne ke liye']);
  if (state === 'over') overlay('Game Over', ['Final Score: ' + score, 'Level reached: ' + level,
    'Best: ' + best, 'Enter / Click / R dabao dobara khelne ke liye']);
}

// ---------- MAIN LOOP ----------
reset();
function loop(t) {
  const dt = Math.min(0.05, (t - (tPrev || t)) / 1000); tPrev = t;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
